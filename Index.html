<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bridge Defense v4.1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; background:#0b0e14; overflow:hidden; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:"Trebuchet MS","Comic Sans MS",Verdana,sans-serif; }
  #stage { position:relative; touch-action:none; user-select:none; -webkit-user-select:none; }
  #game { display:block; touch-action:none; background:#10141c; }
  .hudbtn { position:absolute; z-index:20; border:2px solid #ffd75e; background:rgba(20,24,34,.85); color:#ffd75e;
    font-weight:bold; border-radius:12px; cursor:pointer; font-family:inherit; }
  .hudbtn:active { transform:scale(.94); }
  #btnPause { top:10px; right:76px; width:56px; height:56px; font-size:24px; }
  #btnMute  { top:10px; right:12px; width:56px; height:56px; font-size:24px; }
  #overlay { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(8,10,16,.82); text-align:center; color:#fff; }
  #overlay.hidden { display:none; }
  #overlay h1 { color:#ffd75e; font-size:52px; letter-spacing:2px; text-shadow:0 4px 0 #7a4a00, 0 6px 18px rgba(0,0,0,.6); margin-bottom:6px; }
  #overlay h2 { color:#ff5a5a; font-size:44px; margin-bottom:8px; }
  #overlay p { color:#cdd6e4; font-size:20px; margin:4px 0; max-width:86%; }
  .bigbtn { margin-top:18px; font-size:28px; font-weight:bold; padding:14px 54px; border-radius:16px; border:3px solid #ffd75e;
    background:linear-gradient(#ffdf7e,#f5a623); color:#4a2c00; cursor:pointer; font-family:inherit;
    box-shadow:0 6px 0 #9c5f00, 0 10px 24px rgba(0,0,0,.5); }
  .bigbtn:active { transform:translateY(4px); box-shadow:0 2px 0 #9c5f00; }
  .bigbtn.secondary { background:linear-gradient(#9fd8ff,#3f8fd2); border-color:#bfe6ff; color:#08304f; box-shadow:0 6px 0 #1f5f96, 0 10px 24px rgba(0,0,0,.5); font-size:22px; padding:10px 40px; }
  #selftest { position:absolute; left:10px; bottom:8px; z-index:25; font-size:13px; color:#7ee787; font-family:monospace;
    background:rgba(0,0,0,.45); padding:3px 8px; border-radius:8px; pointer-events:none; }
  #toast { position:absolute; left:50%; bottom:120px; transform:translateX(-50%); z-index:26; font-size:22px; font-weight:bold;
    color:#fff; background:rgba(0,0,0,.65); padding:8px 22px; border-radius:14px; border:2px solid #ffd75e;
    opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="720" height="1280"></canvas>
  <button id="btnPause" class="hudbtn" title="Pause">⏸</button>
  <button id="btnMute" class="hudbtn" title="Mute">🔊</button>
  <div id="toast"></div>
  <div id="selftest">…</div>
  <div id="overlay"></div>
</div>
<script>
"use strict";
/* =====================================================================
   BRIDGE DEFENSE v4 — vertical crowd shooter (9:16, 720x1280 logical)
   Pure game logic is DOM-free (createGame/update) so the Node harness
   can run the REAL update loop with stubs. Rendering/audio/input are
   window-only. In Node (no window), pure parts are exported.
   ===================================================================== */

// ----------------------------- constants -----------------------------
const W = 720, H = 1280;
const LANE_X0 = 96, LANE_X1 = 624;          // playable lane
const CROWD_Y = 1052;                        // crowd anchor line
const LEAK_Y  = 1000;                        // enemy reaching this kills a troop
const TROOP_CAP = 60;
const SAVE_KEY = 'bd_save_v1';
const MID_X = (LANE_X0+LANE_X1)/2;       // v2 left/right split
const DEADLINE_Y = 880;                  // v2 right-side number blocks crossing this = game over
const BLOCK_X = 492;                     // v2 number-block column (right half)

// ----------------------------- pure helpers --------------------------
const DMG_CAP = 3, RATE_CAP = 2.5, PIERCE_CAP = 3;   // v3 hard caps
const BULLET_CAP = 400, PARTICLE_CAP = 300;          // v3 perf caps
function clampStats(g){ g.troops=Math.min(TROOP_CAP,g.troops); g.dmgMul=Math.min(DMG_CAP,g.dmgMul); g.rateMul=Math.min(RATE_CAP,g.rateMul); g.pierce=Math.min(PIERCE_CAP,g.pierce); if(g.soldiers) syncSoldiers(g); return g; }
function pushBullet(g,b){ g.bullets.push(b); if(g.bullets.length>BULLET_CAP){ const old=g.bullets.shift(); g.bulletPool.push(old); } }
function sapperHeal(wave){ return 9+wave*1.3; }      // v3: sapper repair rate /s
const GATE_POOL = [
  { id:'t10',  label:'+10 TROOPS',        sub:'More soldiers!',        apply:s=>{ s.troops+=10; clampStats(s); } },
  { id:'t2x',  label:'\u00D72 TROOPS',    sub:'Double the squad!',     apply:s=>{ s.troops*=2; clampStats(s); } },
  { id:'d50',  label:'+50% DMG',          sub:'Harder hits!',          apply:s=>{ s.dmgMul*=1.5; clampStats(s); } },
  { id:'r50',  label:'FIRE RATE \u00D71.5', sub:'Faster shooting!',    apply:s=>{ s.rateMul*=1.5; clampStats(s); } },
  { id:'t5d25',label:'+5 TROOPS & +25% DMG', sub:'Best of both!',       apply:s=>{ s.troops+=5; s.dmgMul*=1.25; clampStats(s); } },
  { id:'p1',   label:'PIERCE +1',         sub:'Bullets fly through!',  apply:s=>{ s.pierce+=1; clampStats(s); } },
];
function pickTwoGates(rng){
  const pool = GATE_POOL.slice();
  const a = Math.floor(rng()*pool.length);
  const ga = pool.splice(a,1)[0];
  const gb = pool.splice(Math.floor(rng()*pool.length),1)[0];
  return [ga,gb];
}
// ---------------- v2: ultimates / cards / number blocks ----------------
const ULT_POOL = [
  { id:'storm', label:'BULLET STORM', sub:'10s screen-wide barrage!', color:'#f5a623' },
  { id:'wall',  label:'IRON WALL',    sub:'8s invincible + reflect!', color:'#3f8fd2' },
];
const CARD_TYPES = [
  { id:'troops', color:'#35c759', tiers:[1,5,10],        apply:(g,v)=>{ g.troops+=v; clampStats(g); } },
  { id:'dmg',    color:'#ff7ad9', tiers:[0.10,0.25,0.50], apply:(g,v)=>{ g.dmgMul+=v; clampStats(g); } },
  { id:'rate',   color:'#5ac8fa', tiers:[0.08,0.20,0.40], apply:(g,v)=>{ g.rateMul+=v; clampStats(g); } },
];
function cardText(c){ const t=CARD_TYPES[c.type], v=t.tiers[c.tier];
  return c.type===0 ? ('+'+v+' TROOPS') : (t.id.toUpperCase()+' +'+Math.round(v*100)+'%'); }
function blockHP(wave, idx){ return Math.max(45, Math.round(95*Math.pow(1.35, wave-1)*(1+idx*0.25))); } // v4: tougher — die at 40-60% screen
function blockCount(wave){ return Math.min(3+Math.floor(wave/2), 10); }
function blockInterval(wave){ return Math.max(5.0 - wave*0.12, 2.4); }
function isPreBossWave(wave){ return (wave+1)%10===0; }   // 9, 19, 29...
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

const ENEMY_TYPES = {
  runner: { hp:3,  speed:165, r:20, score:1 },
  dasher: { hp:7,  speed:126, r:24, score:2 },
  brute:  { hp:15, speed:70,  r:32, score:3 },
  shield: { hp:10, speed:0,   r:34, score:2 },   // v3: bodyguard, frontal shield pool
  sapper: { hp:12, speed:150, r:22, score:2 },   // v3: heals adjacent number blocks
};
function enemyHP(base, wave){ return Math.max(1, Math.round(base * Math.pow(1.14, wave-1))); }
function waveComp(wave){
  // returns array of type ids for the wave (boss waves handled separately)
  const n = Math.min(6 + Math.floor(wave*1.4), 30);
  const comp = [];
  for(let i=0;i<n;i++){
    const r = Math.random();
    let t = 'runner';
    if(wave>=3 && r<0.20) t='brute';
    else if(wave>=2 && r<0.50) t='dasher';
    comp.push(t);
  }
  return comp;
}
function spawnInterval(wave){ return Math.max(0.85 - wave*0.022, 0.34); }
function isBossWave(wave){ return wave%10===0; }
function bossHP(wave){ const k=wave/10; return Math.round(1200*Math.pow(1.22,k-1)); }
function hasGates(wave){ return wave%2===0 && !isBossWave(wave); }

// ----------------------------- state ---------------------------------
function createGame(){
  return {
    state:'title',           // title | play | pause | over
    t:0, wave:0, kills:0,
    troops:12, dmgMul:1, rateMul:1, pierce:0,
    crowdX:(LANE_X0+LANE_X1)/2, crowdTX:(LANE_X0+LANE_X1)/2,
    soldiers:[],             // {ox,oy,cd,ph} offsets around anchor, cooldown, phase
    bullets:[],              // {x,y,vy,dmg,pierce,hit:[]}
    bulletPool:[],
    enemies:[],              // {type,x,y,hp,maxhp,speed,r,ph,flash}
    pickups:[],              // {kind:'bullets'|'star',x,y,vy}
    gates:[],                // {a,b,y,vy,applied}
    particles:[],            // {x,y,vx,vy,life,maxlife,size,color}
    floaters:[],             // {x,y,txt,life,color,size}
    boss:null,               // {x,y,hp,maxhp,dir,sumT,chargeT,state,tele}
    spawnQueue:[], spawnT:0,
    blocks:[],               // v2 number blocks {x,y,hp,maxhp,vy,r,ph,flash,isBlock}
    blockQueue:[], blockT:0, // v2 pending block indices
    cards:[],                // v2 bonus cards {type,tier,x,y,vy,ph,flash}
    rewards:[],              // v2 block rewards {kind:'mg'|'dmg'|'troops',x,y,vy,ph}
    ultGate:null,            // v2 pre-boss choice {a,b,y,vy}
    ultimate:null,           // v2 armed ultimate 'storm'|'wall'
    stormT:0, stormAcc:0, wallT:0, mgT:0,  // v2 effect timers
    blockWarn:0,             // v2 deadline proximity flag
    interT:0, phase:'banner', // banner | combat | clear
    shake:0, warnT:0,
    fireTick:0,
    saveT:0,
    sfx:[],                  // queued sfx {name,x}
    stats:{shots:0},
    overReason:'',
  };
}
function syncSoldiers(g){
  // keep soldiers array length == troops, stable offsets
  while(g.soldiers.length < g.troops){
    const i=g.soldiers.length;
    const ring=Math.floor(i/8), k=i%8;
    const ang=(k/8)*Math.PI*2 + ring*0.4;
    const rad= 26 + ring*30;
    g.soldiers.push({ox:Math.cos(ang)*rad*1.15, oy:Math.sin(ang)*rad*0.7 - ring*6, cd:Math.random()*0.2, ph:Math.random()*6.28});
  }
  while(g.soldiers.length > g.troops) g.soldiers.pop();
}
function soldierDamage(g){ return 1*g.dmgMul; }
function soldierInterval(g){ return (1/3)/g.rateMul/(g.mgT>0?2:1); } // v2: machine gun doubles rate

// ----------------------------- update (pure) -------------------------
function fireBullet(g, s){
  let b = g.bulletPool.pop();
  if(!b) b={};
  b.x=g.crowdX+s.ox; b.y=CROWD_Y+s.oy-26; b.vy=-950; b.vx=0;
  b.dmg=soldierDamage(g); b.pierce=g.pierce; b.hit=[];
  pushBullet(g,b);
  g.stats.shots++;
  if(g.sfx.length<40) g.sfx.push({name:'shoot', x:b.x});
  s.squash=1; // recoil pop
}
function spawnEnemy(g, type, x){
  const T=ENEMY_TYPES[type];
  const hp=enemyHP(T.hp, g.wave);
  g.enemies.push({type, x, y:-40, hp, maxhp:hp, speed:T.speed*(0.92+Math.random()*0.16),
    r:T.r, ph:Math.random()*6.28, flash:0, weave: type==='dasher'? 70+Math.random()*40 : 0});
}
function spawnPickup(g, kind, x){
  g.pickups.push({kind, x:x==null?(LANE_X0+80+Math.random()*(LANE_X1-LANE_X0-160)):x, y:-30, vy:95, ph:Math.random()*6.28});
}
function spawnBlock(g, idx){
  const hp=blockHP(g.wave, idx);
  g.blocks.push({isBlock:true, x:BLOCK_X+(Math.random()*70-35), y:-70, hp, maxhp:hp,
    vy:42+Math.min(20,g.wave*1.2), r:56, ph:Math.random()*6.28, flash:0});
  const b=g.blocks[g.blocks.length-1];
  if(g.wave>=2 && Math.random()<0.80) spawnShield(g,b);   // v4 escort from wave 2
  if(g.wave>=2 && Math.random()<0.70) spawnSapper(g,b);   // v4 escort from wave 2
}
function spawnShield(g, b){
  const hp=enemyHP(10,g.wave), sh=enemyHP(26,g.wave);
  const e={type:'shield', x:b.x+(Math.random()*40-20), y:b.y+150, hp, maxhp:hp,
    shield:sh, maxshield:sh, speed:0, vy:b.vy, r:34, ph:Math.random()*6.28, flash:0,
    escort:true, blk:b, offX:0, offY:150};
  g.enemies.push(e); return e;
}
function spawnSapper(g, b){
  const hp=enemyHP(8,g.wave);
  const e={type:'sapper', x:b.x+95, y:b.y-20, hp, maxhp:hp,
    speed:0, vy:b.vy, r:22, ph:Math.random()*6.28, flash:0,
    escort:true, blk:b, offX:95, offY:-20};
  g.enemies.push(e); return e;
}
function spawnCard(g){
  g.cards.push({type:Math.floor(Math.random()*CARD_TYPES.length), tier:0,
    x:LANE_X0+90+Math.random()*(LANE_X1-LANE_X0-180), y:-40,
    vy:105+Math.random()*20, ph:Math.random()*6.28, flash:0});
}
function hitCard(g, c){
  const r=Math.random();
  if(r<0.85){ if(c.tier<2){ c.tier++; c.flash=0.3; addFloater(g,c.x,c.y-46,'UP!','#7ee787',24); g.sfx.push({name:'click',x:c.x}); } }
  else if(c.tier>0){ c.tier--; c.flash=-0.4; addFloater(g,c.x,c.y-46,'DOWN!','#ff5a5a',24); g.sfx.push({name:'hurt',x:c.x}); }
  burst(g,c.x,c.y,6, c.flash<0?'#ff5a5a':'#7ee787', 160);
}
function settleCard(g, c){
  const t=CARD_TYPES[c.type];
  t.apply(g, t.tiers[c.tier]);
  addFloater(g,c.x,c.y,cardText(c),'#ffd75e',26);
  g.sfx.push({name:'pickup',x:c.x});
  burst(g,c.x,c.y,10,'#fff8c9');
}
function smashBlock(g, b){
  const i=g.blocks.indexOf(b); if(i>=0) g.blocks.splice(i,1);
  for(const e of g.enemies){ if(e.blk===b){ e.blk=null; if(e.type==='shield') e.escort=false; } } // v3: escorts lose their block
  g.kills+=5;
  burst(g,b.x,b.y,26,'#ffb35c',380); burst(g,b.x,b.y,14,'#ffd75e',260);
  g.shake=Math.min(14,g.shake+6);
  g.sfx.push({name:'boom', x:b.x});
  addFloater(g,b.x,b.y,'SMASH! +5','#ffd75e',30);
  if(Math.random()<0.35){   // v4: 55% -> 35%
    const kinds=['mg','dmg','troops'];
    g.rewards.push({kind:kinds[Math.floor(Math.random()*3)], x:b.x, y:b.y, vy:85, ph:Math.random()*6.28});
  }
}
function triggerUltimate(g){
  const u=g.ultimate; g.ultimate=null;
  if(u==='storm'){
    g.stormT=10; g.stormAcc=0;
    addFloater(g,W/2,560,'\u26A1 BULLET STORM! \u26A1','#ffd75e',54);
    g.shake=12; g.sfx.push({name:'warn', x:W/2});
    burst(g,W/2,400,40,'#ffd75e',520);
  } else if(u==='wall'){
    g.wallT=8;
    addFloater(g,W/2,560,'\uD83D\uDEE1 IRON WALL! \uD83D\uDEE1','#9fd8ff',54);
    g.sfx.push({name:'tele', x:W/2});
    burst(g,g.crowdX,CROWD_Y,30,'#9fd8ff',420);
  }
}
function stormTick(g,dt){
  g.stormAcc+=dt;
  while(g.stormAcc>0.05){
    g.stormAcc-=0.05;
    for(let k=0;k<3;k++){
      let b=g.bulletPool.pop(); if(!b)b={};
      b.x=g.crowdX+(Math.random()*380-190); b.y=CROWD_Y-40;
      b.vy=-1150; b.vx=(Math.random()*2-1)*260;
      b.dmg=soldierDamage(g)*2; b.pierce=2; b.hit=[]; b.storm=true;
      pushBullet(g,b); g.stats.shots++;
    }
    for(let k=0;k<2 && g.particles.length<PARTICLE_CAP;k++){
      g.particles.push({x:LANE_X0+Math.random()*(LANE_X1-LANE_X0), y:-20-Math.random()*80,
        vx:0, vy:950+Math.random()*350, life:0.9, maxlife:0.9, size:5+Math.random()*4, color:'#ffe27a', sword:true});
    }
  }
  if(Math.random()<dt*8 && g.sfx.length<40) g.sfx.push({name:'shoot', x:g.crowdX});
}
function startWave(g){
  g.wave++;
  g.phase='combat'; g.spawnQueue=[]; g.spawnT=0;
  if(isBossWave(g.wave)){
    g.warnT=2.2;
    g.sfx.push({name:'warn', x:W/2});
    g.boss={x:W/2, y:-160, hp:bossHP(g.wave), maxhp:bossHP(g.wave), dir:1, sumT:3, state:'enter', tele:0, chargeT:0, atkT:5, ph:0, r:78, flash:0};
    if(g.ultimate) triggerUltimate(g);   // v2: armed ultimate fires as the boss arrives
  } else {
    const comp=waveComp(g.wave);
    g.spawnQueue=comp;
    g.spawnT=0.5;
    // v2: number blocks press the right side; bonus cards drift mid (replaces old pickups)
    g.blockQueue=[]; const nB=blockCount(g.wave); for(let i=0;i<nB;i++) g.blockQueue.push(i); g.blockT=1.4;
    spawnCard(g);   // v4: exactly 1 card/wave
    // v2: ultimate choice on the wave before a boss
    if(isPreBossWave(g.wave)) g.ultGate={a:ULT_POOL[0],b:ULT_POOL[1],y:-160,vy:135};
  }
  if(hasGates(g.wave)){
    const rng=Math.random;
    const [ga,gb]=pickTwoGates(rng);
    g.gates.push({a:ga,b:gb,y:-140,vy:135,applied:false});
  }
  g.sfx.push({name:'wave', x:W/2});
}
function applyGate(g, gate){
  gate.applied=true;
  gate.apply(g);
  g.sfx.push({name:'gate', x:g.crowdX});
  addFloater(g, g.crowdX, CROWD_Y-120, gate.label, '#ffd75e', 34);
  burst(g, g.crowdX, CROWD_Y-60, 16, '#ffd75e');
  syncSoldiers(g);
}
function addFloater(g,x,y,txt,color,size){ if(g.floaters.length<48) g.floaters.push({x,y,txt,life:1.1,color:color||'#fff',size:size||22}); }
function burst(g,x,y,n,color,spd){
  spd=spd||260;
  for(let i=0;i<n && g.particles.length<PARTICLE_CAP;i++){
    const a=Math.random()*6.283, s=spd*(0.3+Math.random()*0.7);
    g.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:0.5+Math.random()*0.4,maxlife:0.9,size:3+Math.random()*5,color});
  }
}
function killEnemy(g,e,silent){
  g.kills+=ENEMY_TYPES[e.type].score;
  burst(g,e.x,e.y, e.type==='brute'?16:9, e.type==='brute'?'#b07fe8':e.type==='shield'?'#5a7bb8':e.type==='sapper'?'#7ee787':'#ff8a5c');
  addFloater(g,e.x,e.y-24,'+'+ENEMY_TYPES[e.type].score,'#ffe9a8',20);
  if(!silent) g.sfx.push({name:'pop', x:e.x});
}
function hurtCrowd(g,n,ex){
  if(g.wallT>0){ addFloater(g,ex==null?g.crowdX:ex,CROWD_Y-60,'BLOCKED!','#9fd8ff',24); if(g.sfx.length<40)g.sfx.push({name:'click',x:g.crowdX}); return; }
  g.troops=Math.max(0,g.troops-n);
  syncSoldiers(g);
  g.shake=Math.min(14,g.shake+8);
  burst(g,ex==null?g.crowdX:ex,CROWD_Y,14,'#ff5a5a');
  g.sfx.push({name:'hurt', x:g.crowdX});
  if(g.troops<=0){ g.state='over'; g.overReason='Squad wiped out on Wave '+g.wave; g.sfx.push({name:'over', x:W/2}); }
}
function update(g, dt, input){
  if(g.state!=='play') return;
  g.t+=dt;
  if(g.warnT>0){ g.warnT-=dt; if(g.warnT<=0 && g.boss && g.boss.state==='enter'){ /* boss enters below */ } }
  // crowd movement
  const spd=560;
  if(input.left) g.crowdTX-=spd*dt;
  if(input.right) g.crowdTX+=spd*dt;
  if(input.dragX!=null) g.crowdTX=input.dragX;
  g.crowdTX=Math.max(LANE_X0+30, Math.min(LANE_X1-30, g.crowdTX));
  g.crowdX += (g.crowdTX-g.crowdX)*Math.min(1, dt*14);
  syncSoldiers(g);

  // wave phase machine
  if(g.phase==='banner'){
    g.interT-=dt;
    if(g.interT<=0) startWave(g);
  } else if(g.phase==='combat'){
    // spawns
    if(g.spawnQueue.length){
      g.spawnT-=dt;
      if(g.spawnT<=0){ g.spawnT=spawnInterval(g.wave); spawnEnemy(g, g.spawnQueue.shift(), LANE_X0+40+Math.random()*(MID_X-LANE_X0-70)); } // v2: left half
    }
    const bossAlive = g.boss && g.boss.hp>0;
    if(!g.spawnQueue.length && !g.enemies.length && !bossAlive && !g.blockQueue.length && !g.blocks.length && g.phase==='combat'){
      // wave clear
      g.phase='clear'; g.interT=1.6;
      const bonus=Math.min(2, TROOP_CAP-g.troops);
      if(bonus>0){ g.troops+=bonus; clampStats(g); addFloater(g,g.crowdX,CROWD_Y-120,'+'+bonus+' TROOPS','#7ee787',26); }
      saveGame(g);
    }
  } else if(g.phase==='clear'){
    g.interT-=dt;
    if(g.interT<=0){ g.phase='banner'; g.interT=1.2; }
  }

  // soldiers firing
  const iv=soldierInterval(g);
  for(const s of g.soldiers){
    s.cd-=dt;
    if(s.squash>0) s.squash-=dt*6;
    if(s.cd<=0){ s.cd=iv*(0.9+Math.random()*0.2); fireBullet(g,s); }
  }
  // bullets
  for(let i=g.bullets.length-1;i>=0;i--){
    const b=g.bullets[i];
    // gentle homing toward nearest enemy ahead (keeps streams useful while positioning matters)
    // v4: fire covers only the crowd's x-band (crowdX ± 70) — standing left can't hit right (storm exempt)
    const covH = b.storm?1e9:90; // v4: tight band — positioning decides, minor aim assist only
    const tlist0 = g.boss&&g.boss.hp>0 ? g.enemies.concat(g.blocks,[g.boss]) : g.enemies.concat(g.blocks);
    let best=null,bd=1e9;
    for(const e of tlist0){ const dy=b.y-e.y; if(dy>0&&dy<400 && Math.abs(e.x-g.crowdX)<=covH+(e.r||40)){ const dx=e.x-b.x, d2=dx*dx+dy*dy; if(d2<bd){bd=d2;best=e;} } }
    if(best){ const want=Math.max(-150,Math.min(150,(best.x-b.x)*4)); b.vx=(b.vx||0)+(want-(b.vx||0))*Math.min(1,dt*5); }
    else if(!b.storm){ const wantC=(g.crowdX-b.x)*4; b.vx=(b.vx||0)+(wantC-b.vx)*Math.min(1,dt*6); } // v4: funnel strays back to the column
    b.x+=(b.vx||0)*dt;
    b.y+=b.vy*dt;
    if(b.y<-30){ g.bullets.splice(i,1); g.bulletPool.push(b); continue; }
    // hit enemies / number blocks (v2)
    let consumed=false;
    const targets = g.boss&&g.boss.hp>0 ? g.enemies.concat(g.blocks,[g.boss]) : g.enemies.concat(g.blocks);
    for(const e of targets){
      if(b.hit.indexOf(e)>=0) continue;
      const dx=b.x-e.x, dy=b.y-e.y, rr=(e.r||40)+5;
      if(dx*dx+dy*dy < rr*rr){
        b.hit.push(e);
        e.flash=0.09;
        if(e.shield>0){   // v3: shieldbearer frontal shield absorbs
          e.shield-=b.dmg;
          addFloater(g,e.x,e.y-56,'SHIELD '+Math.max(0,Math.ceil(e.shield)),'#9fd8ff',18);
          burst(g,b.x,b.y,4,'#5a7bb8',150);
          if(g.sfx.length<40) g.sfx.push({name:'hit', x:b.x});
          if(e.shield<=0){ addFloater(g,e.x,e.y-80,'SHIELD DOWN!','#ffd75e',20); g.sfx.push({name:'boom',x:e.x}); }
        } else e.hp-=b.dmg;
        if(e.isBlock){
          addFloater(g,e.x,e.y-72, ''+Math.max(0,Math.ceil(e.hp)), '#ffb35c', 26);
          burst(g,b.x,b.y,4,'#ffb35c',160);
          if(g.sfx.length<40) g.sfx.push({name:'hit', x:b.x});
          if(e.hp<=0) smashBlock(g,e);
        } else {
          addFloater(g,e.x,e.y-(e.r||40)-8, Math.round(b.dmg), '#fff', 18);
          burst(g,b.x,b.y,3,'#ffd75e',140);
          if(g.sfx.length<40) g.sfx.push({name:'hit', x:b.x});
        }
        if(b.pierce>0){ b.pierce--; } else { consumed=true; }
        break;
      }
    }
    if(consumed){ g.bullets.splice(i,1); g.bulletPool.push(b); }
  }
  // v2: bullets vs bonus cards — shot cards tier up (usually); bullet consumed
  for(let i=g.bullets.length-1;i>=0;i--){
    const b=g.bullets[i];
    let hitC=false;
    for(const c of g.cards){
      const dx=b.x-c.x, dy=b.y-c.y;
      if(dx*dx+dy*dy < 54*54){ hitCard(g,c); hitC=true; break; }
    }
    if(hitC){ g.bullets.splice(i,1); g.bulletPool.push(b); }
  }
  // enemies
  for(let i=g.enemies.length-1;i>=0;i--){
    const e=g.enemies[i];
    if(e.flash>0)e.flash-=dt;
    e.ph+=dt*6;
    if(e.escort && e.blk && g.blocks.indexOf(e.blk)>=0){
      // v3: escort follows its number block
      e.x=e.blk.x+(e.offX||0); e.y=e.blk.y+(e.offY||0);
      if(e.type==='sapper' && e.blk.hp<e.blk.maxhp){
        e.blk.hp=Math.min(e.blk.maxhp, e.blk.hp+sapperHeal(g.wave)*dt);
        if(Math.random()<dt*6) burst(g,e.blk.x,e.blk.y-40,1,'#7ee787',60);
      }
    } else {
      if(e.escort){ e.escort=false;
        if(e.type==='sapper'){ // v3: orphaned sapper seeks another block
          let nb=null,nd=1e9; for(const bl of g.blocks){ const d=Math.abs(bl.x-e.x)+Math.abs(bl.y-e.y); if(d<nd){nd=d;nb=bl;} }
          if(nb){ e.blk=nb; e.offX=95; e.offY=-20; e.escort=true; }
        }
      }
      e.y+=(e.escort?0:(e.vy||e.speed))*dt;
      if(e.weave) e.x+=Math.sin(e.ph*0.9)*e.weave*dt;
    }
    e.x=Math.max(LANE_X0+10,Math.min(LANE_X1-10,e.x));
    if(e.hp<=0){ killEnemy(g,e); g.enemies.splice(i,1); continue; }
    if(e.y>=LEAK_Y){ if(e.type!=='sapper') hurtCrowd(g,e.type==='brute'?2:1,e.x); g.enemies.splice(i,1); continue; } // v2: brutes eat 2; v3: sapper leaks silently
  }
  // v2: iron wall reflect ring
  if(g.wallT>0){
    const R=150, dps=60*g.dmgMul;
    for(const e of g.enemies){
      const dx=e.x-g.crowdX, dy=e.y-CROWD_Y;
      if(dx*dx+dy*dy<R*R){ e.hp-=dps*dt; e.flash=0.05; if(Math.random()<dt*10)burst(g,e.x,e.y,2,'#9fd8ff',120); }
    }
    if(g.boss&&g.boss.hp>0){ const bo=g.boss, dx=bo.x-g.crowdX, dy=bo.y-CROWD_Y; if(dx*dx+dy*dy<(R+90)*(R+90)){ bo.hp-=dps*1.5*dt; bo.flash=0.05; } }
  }
  // v2: number blocks descend (right side)
  if(g.phase==='combat' && g.blockQueue.length){
    g.blockT-=dt;
    const lastB=g.blocks[g.blocks.length-1];
    if(g.blockT<=0 && g.blocks.length<3 && (!lastB || lastB.y>110)){
      g.blockT=blockInterval(g.wave); spawnBlock(g, g.blockQueue.shift());
    }
  }
  let nearestB=1e9;
  for(let i=g.blocks.length-1;i>=0;i--){
    const bl=g.blocks[i];
    if(bl.flash>0)bl.flash-=dt;
    bl.ph+=dt*3; bl.y+=bl.vy*dt;
    if(bl.hp<=0){ smashBlock(g,bl); continue; }
    if(bl.y>=DEADLINE_Y){
      g.state='over'; g.overReason='The numbers broke through on Wave '+g.wave+'!';
      g.sfx.push({name:'over', x:W/2}); g.shake=16;
      break;
    }
    nearestB=Math.min(nearestB, DEADLINE_Y-bl.y);
  }
  g.blockWarn = nearestB<240 ? 1 : 0;
  // v2: bonus cards drift & settle
  for(let i=g.cards.length-1;i>=0;i--){
    const c=g.cards[i];
    c.y+=c.vy*dt; c.ph+=dt*4;
    if(c.flash>0)c.flash-=dt; else if(c.flash<0)c.flash+=dt;
    const dx=c.x-g.crowdX, dy=c.y-CROWD_Y;
    if(dx*dx+dy*dy < 80*80 || c.y>=CROWD_Y-40){ settleCard(g,c); g.cards.splice(i,1); continue; }
    if(c.y>H+60) g.cards.splice(i,1);
  }
  // v2: block rewards drift & collect
  for(let i=g.rewards.length-1;i>=0;i--){
    const r=g.rewards[i];
    r.y+=r.vy*dt; r.ph+=dt*4;
    const dx=r.x-g.crowdX, dy=r.y-CROWD_Y;
    if(dx*dx+dy*dy < 80*80){
      if(r.kind==='mg'){ g.mgT=4; addFloater(g,r.x,r.y,'MACHINE GUN!','#ffd75e',28); }
      else if(r.kind==='dmg'){ g.dmgMul+=0.10; clampStats(g); addFloater(g,r.x,r.y,'DMG +10%','#ffb3ff',26); }
      else { g.troops+=3; clampStats(g); addFloater(g,r.x,r.y,'+3 TROOPS','#7ee787',26); }
      g.sfx.push({name:'pickup', x:r.x}); burst(g,r.x,r.y,12,'#fff8c9');
      g.rewards.splice(i,1); continue;
    }
    if(r.y>H+40) g.rewards.splice(i,1);
  }
  // v2: ultimate choice gate (pre-boss wave)
  if(g.ultGate){
    const ug=g.ultGate;
    ug.y+=ug.vy*dt;
    if(ug.y>=CROWD_Y-40){
      g.ultimate = g.crowdX<MID_X ? ug.a.id : ug.b.id;
      const nm = g.ultimate==='storm'?'BULLET STORM':'IRON WALL';
      addFloater(g,g.crowdX,CROWD_Y-150,nm+' ARMED!','#ffd75e',34);
      g.sfx.push({name:'gate', x:g.crowdX});
      burst(g,g.crowdX,CROWD_Y-60,18,'#ffd75e');
      g.ultGate=null;
    }
  }
  // boss
  if(g.boss) updateBoss(g, dt);
  // gates descend
  for(let i=g.gates.length-1;i>=0;i--){
    const gt=g.gates[i];
    if(!gt.applied){
      gt.y+=gt.vy*dt;
      if(gt.y>=CROWD_Y-40){
        const mid=(LANE_X0+LANE_X1)/2;
        applyGate(g, g.crowdX<mid?gt.a:gt.b);
        g.gates.splice(i,1);
      }
    }
  }
  // pickups drift & collect
  for(let i=g.pickups.length-1;i>=0;i--){
    const p=g.pickups[i];
    p.y+=p.vy*dt; p.ph+=dt*4;
    const dx=p.x-g.crowdX, dy=p.y-CROWD_Y;
    if(dx*dx+dy*dy < 70*70){
      if(p.kind==='bullets'){ g.rateMul+=0.08; addFloater(g,p.x,p.y,'FIRE RATE UP','#9fd8ff',22); }
      else { g.dmgMul+=0.10; addFloater(g,p.x,p.y,'DMG UP','#ffb3ff',22); }
      g.sfx.push({name:'pickup', x:p.x});
      burst(g,p.x,p.y,10,'#fff8c9');
      g.pickups.splice(i,1); continue;
    }
    if(p.y>H+40) g.pickups.splice(i,1);
  }
  // particles / floaters
  for(let i=g.particles.length-1;i>=0;i--){ const p=g.particles[i]; p.life-=dt; if(p.life<=0){g.particles.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; }
  for(let i=g.floaters.length-1;i>=0;i--){ const f=g.floaters[i]; f.life-=dt; f.y-=46*dt; if(f.life<=0)g.floaters.splice(i,1); }
  if(g.shake>0) g.shake=Math.max(0,g.shake-dt*40);
  // v2: effect timers
  if(g.mgT>0)g.mgT-=dt;
  if(g.wallT>0)g.wallT-=dt;
  if(g.stormT>0){ g.stormT-=dt; stormTick(g,dt); }
  clampStats(g);   // v3: no bonus path may bypass caps
  // autosave timer
  g.saveT+=dt;
  if(g.saveT>30){ g.saveT=0; saveGame(g); }
  g.sfx.length=Math.min(g.sfx.length,60);
}
function updateBoss(g, dt){
  const b=g.boss;
  b.ph+=dt;
  if(b.flash>0)b.flash-=dt;
  if(b.state==='enter'){
    b.y+=220*dt;
    if(b.y>=300){ b.y=300; b.state='fight'; }
    return;
  }
  if(b.hp<=0){
    // death handled by caller check
    burst(g,b.x,b.y,40,'#ff5a5a',420);
    burst(g,b.x,b.y,24,'#ffd75e',300);
    g.sfx.push({name:'boom', x:b.x});
    addFloater(g,b.x,b.y,'BOSS DOWN! +8 TROOPS','#ffd75e',36);
    g.troops+=8; clampStats(g);
    g.kills+=25;
    g.boss=null;
    return;
  }
  // strafe
  if(b.state==='fight'){
    b.x+=Math.sin(b.ph*0.9)*170*dt*b.dir;
    if(b.x<LANE_X0+90){b.x=LANE_X0+90;b.dir=1;} if(b.x>LANE_X1-90){b.x=LANE_X1-90;b.dir=-1;}
    b.atkT-=dt; b.sumT-=dt;
    if(b.sumT<=0 && g.enemies.length<8){ b.sumT=4; spawnEnemy(g,'runner',b.x-50); spawnEnemy(g,'runner',b.x+50); addFloater(g,b.x,b.y+90,'SUMMON!','#ff9a5c',22); }
    if(b.atkT<=0){ b.atkT=7; b.state='tele'; b.tele=0.9; g.sfx.push({name:'tele', x:b.x}); }
  } else if(b.state==='tele'){
    b.tele-=dt;
    if(b.tele<=0){ b.state='charge'; b.vy=950; }
  } else if(b.state==='charge'){
    b.y+=b.vy*dt;
    const dx=b.x-g.crowdX;
    if(b.y>=CROWD_Y-70){
      if(g.wallT>0){ b.hp-=250; b.flash=0.2; addFloater(g,b.x,CROWD_Y-170,'REFLECTED!','#9fd8ff',30); g.sfx.push({name:'boom',x:b.x}); }
      else if(Math.abs(dx)<130){ hurtCrowd(g,3,b.x); }
      burst(g,b.x,CROWD_Y-40,20,'#ff8a5c',380);
      g.shake=14; g.sfx.push({name:'boom', x:b.x});
      b.state='return';
    }
  } else if(b.state==='return'){
    b.y-=620*dt;
    if(b.y<=300){ b.y=300; b.state='fight'; }
  }
}
// boss treated as hittable in bullet loop via concat; needs r & flash fields
function bossAsTarget(b){ b.r=b.r||78; return b; }

// ----------------------------- save ----------------------------------
function saveGame(g){
  try{
    const d={wave:g.wave,troops:g.troops,dmgMul:g.dmgMul,rateMul:g.rateMul,pierce:g.pierce,kills:g.kills,t:Date.now()};
    localStorage.setItem(SAVE_KEY, JSON.stringify(d));
  }catch(e){}
}
function loadSave(){
  try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

}

const SPR = {};
function loadSprites(done){
  let data={};
  try{ data=JSON.parse(SPRITE_SRC); }catch(e){ data={}; }
  const keys=Object.keys(data);
  if(!keys.length){ done(0); return; }
  let n=0;
  keys.forEach(k=>{
    const img=new Image();
    img.onload=img.onerror=()=>{ if(++n===keys.length) done(n); };
    img.src=data[k]; SPR[k]=img;
  });
}

let AC=null, master=null, verb=null, muted=false, lastShootSfx=0;

function audioInit(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();
    comp.threshold.value=-18; comp.ratio.value=6;
    master=AC.createGain(); master.gain.value=0.5;
    master.connect(comp); comp.connect(AC.destination);
    // generated impulse reverb
    const len=Math.floor(AC.sampleRate*1.1), imp=AC.createBuffer(2,len,AC.sampleRate);
    for(let c=0;c<2;c++){ const d=imp.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4); }
    verb=AC.createConvolver(); verb.buffer=imp;
    const wet=AC.createGain(); wet.gain.value=0.16;
    verb.connect(wet); wet.connect(master);
  }catch(e){ AC=null; }
}
function panNode(x){
  const p=AC.createStereoPanner?AC.createStereoPanner():null;
  if(p){ p.pan.value=Math.max(-1,Math.min(1,(x/W)*2-1)); p.connect(master); verb&&p.connect(verb); }
  return p||master;
}
function tone(f0,f1,dur,type,vol,x,when){
  if(!AC||muted)return;
  const t=AC.currentTime+(when||0);

  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);

function playSfx(name,x){

  switch(name){
    case 'shoot': if(now-lastShootSfx<40)return; lastShootSfx=now; tone(760+Math.random()*120,340,0.055,'square',0.045,x); break;
    case 'hit': noiseBurst(0.045,0.05,x,3200); break;

        ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(e.x-w2/2,yy,w2,7);
        if(e.type==='shield'&&e.shield>0){ ctx.fillStyle='#5a7bb8'; ctx.fillRect(e.x-w2/2,yy,w2*Math.max(0,e.shield/e.maxshield),7); }
        else { ctx.fillStyle='#ff5a5a'; ctx.fillRect(e.x-w2/2,yy,w2*Math.max(0,e.hp/e.maxhp),7); }
      }
      continue; }
    const img=e.type==='runner'?SPR.runner:e.type==='brute'?SPR.brute:SPR.dasher;
    const base=e.type==='brute'?104:e.type==='dasher'?72:64;
    const sq=e.flash>0?1-e.flash*2.2:1;
    if(img&&img.complete&&img.naturalWidth){
      const zw=sq>0?1/sq:1, zh=sq;
      ctx.drawImage(img,e.x-base*zw/2,e.y-base*zh/2,base*zw,base*zh);
    }
    if(e.flash>0){ ctx.globalAlpha=Math.min(1,e.flash*8); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(e.x,e.y,base/2,0,7); ctx.fill(); ctx.globalAlpha=1; }
    // hp pip
    if(e.hp<e.maxhp){
      const w2=44;
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(e.x-w2/2,e.y-e.r-16,w2,7);
      ctx.fillStyle='#ff5a5a'; ctx.fillRect(e.x-w2/2,e.y-e.r-16,w2*Math.max(0,e.hp/e.maxhp),7);
    }
  }
  // boss
  const b=G.boss;
  if(b){
    const teleFlash=b.state==='tele'&&(Math.floor(b.ph*10)%2===0);
    ctx.save(); ctx.translate(b.x,b.y);
    const sq2=1+0.05*Math.sin(b.ph*3);
    ctx.scale(1/sq2,sq2);
    drawSprite(SPR.boss,0,0,208,182);
    if(b.flash>0){ ctx.globalAlpha=Math.min(1,b.flash*8); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,90,0,7); ctx.fill(); ctx.globalAlpha=1; }
    ctx.restore();
    if(teleFlash){ ctx.strokeStyle='rgba(255,60,60,.9)'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(b.x,CROWD_Y-120); ctx.lineTo(b.x,b.y+90); ctx.stroke(); }
  }
  // bullets (v4: visual density cap — thinner + translucent when many)
  const _bn=G.bullets.length, _bw=_bn>150?0.62:1;
  if(_bn>250) ctx.globalAlpha=0.7;
  for(const bl of G.bullets){
    ctx.save(); ctx.translate(bl.x,bl.y); ctx.rotate(bl.storm?Math.atan2(bl.vy,bl.vx||0.001)+Math.PI/2:0);
    if(bl.storm){ ctx.fillStyle='#fff3b0'; rr(-6*_bw,-16,12*_bw,32,6); ctx.fill(); ctx.fillStyle='#e09a00'; rr(-2*_bw,-16,4*_bw,32,2); ctx.fill(); }
    else{ ctx.fillStyle='#ffd75e'; rr(-4*_bw,-11,8*_bw,22,4); ctx.fill(); ctx.fillStyle='#fff8d0'; rr(-1.5*_bw,-11,3*_bw,22,1.5); ctx.fill(); }
    ctx.restore();
  }
  ctx.globalAlpha=1;
  // soldiers (v4: pre-rendered Q-version frames, batch blit — no circle fallback)
  const sframes=SPR.soldierFrames;
  for(const s of G.soldiers){
    const x=G.crowdX+s.ox, y=CROWD_Y+s.oy;
    if(sframes&&sframes.length){
      const f=sframes[Math.floor(G.t*7+s.ph*2)%3];
      const zw=s.squash>0?1+0.12*s.squash:1, zh=s.squash>0?1-0.16*s.squash:1;
      ctx.drawImage(f,x-26*zw,y-29*zh,52*zw,58*zh);
    }
    // muzzle flash
    if(s.squash>0.55){
      ctx.save(); ctx.globalAlpha=(s.squash-0.55)*2; ctx.translate(x,y-34);
      ctx.fillStyle='#ffe27a'; ctx.beginPath(); ctx.arc(0,0,10,0,7); ctx.fill();
      ctx.restore();
    }
  }
  // v2: iron wall ring
  if(G.wallT>0){
    ctx.save(); ctx.strokeStyle='rgba(120,190,255,'+(0.55+0.3*Math.sin(G.t*10))+')'; ctx.lineWidth=8;
    ctx.shadowColor='#5ac8fa'; ctx.shadowBlur=24;
    ctx.beginPath(); ctx.ellipse(G.crowdX,CROWD_Y,150,90,0,0,7); ctx.stroke(); ctx.restore();
  }
  // v2: bullet storm vignette (v3: cheap flat bar, no fullscreen gradient)
  if(G.stormT>0){
    ctx.fillStyle='rgba(255,180,60,'+(0.10+0.04*Math.sin(G.t*12))+')'; ctx.fillRect(0,0,W,26);
  }
  // particles
  for(const p of G.particles){
    ctx.globalAlpha=Math.max(0,p.life/p.maxlife);
    ctx.fillStyle=p.color;
    if(p.sword) ctx.fillRect(p.x-2,p.y-26,4,52);   // v2: falling golden swords
    else ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
  // floaters
  for(const f of G.floaters){
    ctx.globalAlpha=Math.min(1,f.life*2);
    text(f.txt,f.x,f.y,f.size,f.color);
  }
  ctx.globalAlpha=1;
  // banners
  if(G.phase==='banner'&&G.state==='play') text('WAVE '+(G.wave+1), W/2, 560, 64, '#ffd75e');
  if(G.phase==='clear') text('WAVE CLEAR!', W/2, 560, 56, '#7ee787');
  if(G.warnT>0&&(Math.floor(G.t*4)%2===0)) text('⚠ BOSS INCOMING ⚠', W/2, 560, 52, '#ff5a5a');
  if(G.blockWarn&&(Math.floor(G.t*5)%2===0)) text('\u26A0 NUMBERS INCOMING \u26A0', W/2, 640, 40, '#ff5a5a');
  ctx.restore();
}
// ---------- main loop ----------
let lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(ts-lastT)/1000||0.016); lastT=ts;
  if(G.state==='play'){
    update(G,dt,input);
    for(const q of G.sfx) playSfx(q.name,q.x);
    G.sfx.length=0;
    if(G.state==='over') showOver();
  }
  if(G.state!=='title') render();
  else { tileOff+=dt*20; drawBG(); }
}
// ---------- selftest ----------
function runSelftest(){
  const res=[];
  const ok=(n,c)=>res.push((c?'PASS':'FAIL')+' '+n);
  try{
    // gate math
    let s={troops:10,dmgMul:1,rateMul:1,pierce:0};
    GATE_POOL[0].apply(s); ok('gate+10',s.troops===20);
    s={troops:10,dmgMul:1,rateMul:1,pierce:0}; GATE_POOL[1].apply(s); ok('gate x2',s.troops===20);
    s={troops:59,dmgMul:1,rateMul:1,pierce:0}; GATE_POOL[1].apply(s); ok('gate x2 cap',s.troops===TROOP_CAP);
    s={troops:10,dmgMul:1,rateMul:1,pierce:0}; GATE_POOL[2].apply(s); ok('gate dmg',s.dmgMul===1.5);
    s={troops:10,dmgMul:1,rateMul:1,pierce:0}; GATE_POOL[3].apply(s); ok('gate rate',s.rateMul===1.5);
    s={troops:10,dmgMul:1,rateMul:1,pierce:0}; GATE_POOL[4].apply(s); ok('gate t5d25',s.troops===15&&s.dmgMul===1.25);
    s={troops:10,dmgMul:1,rateMul:1,pierce:0}; GATE_POOL[5].apply(s); ok('gate pierce',s.pierce===1);
    const [ga,gb]=pickTwoGates(Math.random); ok('gates distinct',ga.id!==gb.id);
    ok('wavecomp',waveComp(1).length>=6&&waveComp(1).length<=26);
    ok('bossWave',isBossWave(10)&&!isBossWave(9));
    ok('hasGates',hasGates(2)&&!hasGates(10)&&!hasGates(3));
    ok('hpScale',enemyHP(10,5)>enemyHP(10,1));
    // live sim 3s
    const g2=createGame(); g2.state='play'; g2.phase='banner'; g2.interT=0.01;
    for(let i=0;i<180;i++) update(g2,1/60,{left:false,right:false,dragX:null});
    ok('sim runs',isFinite(g2.crowdX)&&g2.stats.shots>0&&g2.wave>=1);
    // boss spawn
    const g3=createGame(); g3.state='play'; g3.wave=9; g3.phase='banner'; g3.interT=0.01;
    update(g3,0.02,{left:false,right:false,dragX:null});
    ok('boss spawn',g3.wave===10&&!!g3.boss&&g3.warnT>0);
    // gate descend & apply
    const g4=createGame(); g4.state='play'; g4.phase='combat';
    g4.gates.push({a:GATE_POOL[0],b:GATE_POOL[1],y:CROWD_Y-100,vy:135,applied:false});
    const t0=g4.troops;
    for(let i=0;i<120;i++) update(g4,1/60,{left:false,right:false,dragX:null});
    ok('gate apply',g4.troops>t0||g4.gates.length===0);
    // save round trip
    saveGame(g2); const sv=loadSave(); ok('save',!!sv&&sv.wave===g2.wave); clearSave();
    // sprites
    const nsp=Object.keys(SPR).length; ok('sprites('+nsp+')',nsp>=6);
    // boss kill flow
    const g5=createGame(); g5.state='play'; g5.wave=10; g5.phase='combat';
    g5.boss={x:W/2,y:300,hp:1,maxhp:100,dir:1,sumT:99,state:'fight',tele:0,chargeT:0,atkT:99,ph:0,r:78,flash:0};
    update(g5,1/60,{left:false,right:false,dragX:null});
    ok('boss dmg path',true);
    // v2: number blocks
    ok('blockHP',blockHP(5,0)>blockHP(1,0));
    ok('blockHP v4 curve',blockHP(1,0)>=60&&blockHP(10,0)>600);
    ok('blockCount',blockCount(1)===3&&blockCount(20)===10);
    ok('preBoss',isPreBossWave(9)&&!isPreBossWave(10));
    const gB=createGame(); gB.state='play'; gB.wave=3; gB.phase='combat';
    spawnBlock(gB,0); gB.blocks[0].y=400; ok('block spawn',gB.blocks.length===1&&gB.blocks[0].hp>0);
    const bb=gB.blocks[0], hp0=bb.hp;
    gB.crowdX=bb.x; gB.bullets.push({x:bb.x,y:bb.y+10,vy:-950,vx:0,dmg:5,pierce:0,hit:[]});
    update(gB,1/60,{left:false,right:false,dragX:bb.x});
    ok('block dmg',bb.hp<hp0);
    // v4: coverage narrow — parked left, right block untouched
    const gC=createGame(); gC.state='play'; gC.wave=2; gC.phase='combat';
    spawnBlock(gC,0); const cb=gC.blocks[0]; cb.x=BLOCK_X; cb.y=400; const chp0=cb.hp;
    gC.crowdX=150;
    for(let i=0;i<240;i++){ update(gC,1/60,{left:false,right:false,dragX:150}); if(gC.state!=='play')break; }
    ok('coverage narrow',gC.blocks.indexOf(cb)>=0&&cb.hp>chp0*0.99);
    ok('logo slot',typeof LOGO_SRC!=='undefined'&&typeof logoHTML==='function');
    ok('logo art',!!LOGO_SRC&&LOGO_SRC.indexOf('data:image/png;base64,')===0&&LOGO_SRC.length>100000);
    ok('soldier frames',!!(SPR.soldierFrames&&SPR.soldierFrames.length===3));
    smashBlock(gB,bb); ok('block smash',gB.blocks.length===0&&gB.rewards.length<=1);
    let drops=0; for(let i=0;i<200;i++){ const gb=createGame(); gb.state='play'; gb.wave=4; spawnBlock(gb,0); smashBlock(gb,gb.blocks[0]); if(gb.rewards.length)drops++; }
    ok('drop rate ~35%',drops>45&&drops<95);
    // v2: deadline fail — crowd parked left, block falls
    const g6=createGame(); g6.state='play'; g6.phase='combat'; g6.wave=2;
    g6.blocks.push({isBlock:true,x:BLOCK_X,y:DEADLINE_Y-30,hp:9999,maxhp:9999,vy:50,r:56,ph:0,flash:0});
    for(let i=0;i<120&&g6.state==='play';i++) update(g6,1/60,{left:false,right:false,dragX:120});
    ok('deadline fail',g6.state==='over');
    // v2: cards
    const g7=createGame(); g7.state='play';
    spawnCard(g7); const cc=g7.cards[0];
    let up=false; for(let i=0;i<30;i++){ const t0=cc.tier; hitCard(g7,cc); if(cc.tier>t0)up=true; }
    ok('card tier up',up&&cc.tier<=2);
    ok('card text',cardText({type:0,tier:2})==='+10 TROOPS');
    const t7=g7.troops; settleCard(g7,cc); ok('card settle',g7.troops>=t7);
    // v2: ultimate choice + trigger
    const g8=createGame(); g8.state='play'; g8.wave=8; g8.phase='banner'; g8.interT=0.01;
    update(g8,0.02,{left:false,right:false,dragX:null});
    ok('ult gate',g8.wave===9&&!!g8.ultGate);
    g8.crowdX=LANE_X0+100; g8.crowdX=Math.min(g8.crowdX,MID_X-10); g8.ultGate.y=CROWD_Y-41;
    update(g8,1/60,{left:false,right:false,dragX:null});
    ok('ult pick',g8.ultimate==='storm');
    g8.wave=9; g8.phase='banner'; g8.interT=0.01;
    update(g8,0.02,{left:false,right:false,dragX:null});
    ok('ult trigger',g8.wave===10&&g8.stormT>0&&!!g8.boss);
    // v2: wall blocks damage
    const g9=createGame(); g9.state='play'; g9.wave=1; g9.wallT=5; const tw9=g9.troops;
    hurtCrowd(g9,3,300); ok('wall block',g9.troops===tw9&&g9.state==='play');
    // v3: caps
    let sc={troops:55,dmgMul:2.9,rateMul:2.4,pierce:2};
    CARD_TYPES[1].apply(sc,0.50); ok('dmg cap',sc.dmgMul===DMG_CAP);
    CARD_TYPES[2].apply(sc,0.40); ok('rate cap',sc.rateMul===RATE_CAP);
    GATE_POOL[5].apply(sc); GATE_POOL[5].apply(sc); ok('pierce cap',sc.pierce===PIERCE_CAP);
    let st={troops:55,dmgMul:1,rateMul:1,pierce:0}; GATE_POOL[1].apply(st); ok('troop cap x2',st.troops===TROOP_CAP);
    // v3: bullet cap
    const gBul=createGame();
    for(let i=0;i<500;i++) pushBullet(gBul,{x:0,y:0,vy:-1,dmg:1,pierce:0,hit:[]});
    ok('bullet cap',gBul.bullets.length<=BULLET_CAP);
    // v3: shield absorbs before body
    const gE=createGame(); gE.state='play'; gE.wave=5; gE.phase='combat';
    const sh0=spawnShield(gE,{x:400,y:300,hp:999,maxhp:999,vy:50});
    const shHP=sh0.hp, shS0=sh0.shield;
    sh0.shield-=5; ok('shield pool',sh0.shield===shS0-5&&sh0.hp===shHP);
    // v3: sapper heals adjacent block
    spawnBlock(gE,0); const bl0=gE.blocks[0]; bl0.hp=bl0.maxhp-60;
    const sp0=spawnSapper(gE,bl0); sp0.blk=bl0; sp0.escort=true; sp0.offX=95; sp0.offY=-20;
    for(let i=0;i<60;i++) update(gE,1/60,{left:false,right:false,dragX:null});
    ok('sapper heal',bl0.hp>bl0.maxhp-60);
  }catch(e){ res.push('FAIL exception:'+e.message); }
  const fails=res.filter(r=>r.indexOf('FAIL')===0);
  const el=document.getElementById('selftest');
  el.textContent=(fails.length?('❌ '+fails.length+' FAIL'):('✅ v4.1 · '+res.length+' checks'))+' · Bridge Defense v4.1';
  el.style.color=fails.length?'#ff7b72':'#7ee787';
  console.log('[selftest]',res.join(' | '));
  return fails.length===0;
}
// ---------- boot ----------
resize();
function makeSoldierFrames(){ // v4: Q-version helmet soldier, 3 frames, pre-rendered once
  const F=[];
  for(let k=0;k<3;k++){
    const c=document.createElement('canvas'); c.width=52; c.height=58;
    const g2=c.getContext('2d');
    const bob=k===0?0:(k===1?-2:2), rec=k===2?3:0;
    const rrect=(x,y,w,h,r)=>{ g2.beginPath(); g2.moveTo(x+r,y); g2.arcTo(x+w,y,x+w,y+h,r); g2.arcTo(x+w,y+h,x,y+h,r); g2.arcTo(x,y+h,x,y,r); g2.arcTo(x,y,x+w,y,r); g2.closePath(); };
    g2.fillStyle='#5a4632'; g2.fillRect(29,4+rec,6,24);          // gun stock
    g2.fillStyle='#2e2620'; g2.fillRect(29,4+rec,6,6);           // gun tip
    g2.fillStyle='#a93226'; rrect(13,32+bob*0.5,26,20,8); g2.fill();   // body
    g2.fillStyle='#7e241a'; rrect(13,44+bob*0.5,26,8,4); g2.fill();    // belt
    g2.fillStyle='#e8b98a'; g2.beginPath(); g2.arc(26,22+bob,14,0,7); g2.fill(); // head
    g2.fillStyle='#c0392b'; g2.beginPath(); g2.arc(26,20+bob,14,Math.PI,0); g2.fill(); // helmet
    g2.fillStyle='#96281b'; g2.fillRect(9,18+bob,34,5);          // helmet brim
    g2.fillStyle='#e74c3c'; g2.beginPath(); g2.arc(26,6+bob,3.5,0,7); g2.fill(); // helmet dot
    g2.fillStyle='#1f1f1f';
    g2.beginPath(); g2.arc(21,24+bob,2.1,0,7); g2.fill();
    g2.beginPath(); g2.arc(31,24+bob,2.1,0,7); g2.fill();        // eyes
    F.push(c);
  }
  return F;
}
loadSprites(()=>{ SPR.soldierFrames=makeSoldierFrames(); runSelftest(); showTitle(); requestAnimationFrame(frame); });
window.__bd={ game:G, input, createGame, update, GATE_POOL, startWave, showTitle, startRun, loadSave,
  spawnBlock, spawnCard, hitCard, settleCard, smashBlock, triggerUltimate, ULT_POOL, CARD_TYPES,
  isPreBossWave, blockHP, MID_X, DEADLINE_Y, BLOCK_X, CROWD_Y,
  spawnShield, spawnSapper, sapperHeal, clampStats, pushBullet, DMG_CAP, RATE_CAP, PIERCE_CAP };
})();
